["El chasis",[
["Para qué sirve",D('El chasis o caja no es solo una carcasa: cumple <b>cinco funciones</b>.')+L(['<b>Sujeta</b> los componentes: placa, fuente, discos y tarjetas.','<b>Protege</b> del polvo, de los golpes y de las interferencias electromagnéticas (la chapa metálica hace de pantalla).','<b>Conduce el aire</b> para refrigerar.','Permite <b>ordenar el cableado</b>.','Da <b>acceso al usuario</b>: botón de encendido, USB y audio del panel frontal.'])],

["Compatibilidad con la placa base",D('El tamaño del chasis lo decide sobre todo el <b>formato de placa</b> que admite. Los agujeros de las placas pequeñas coinciden con parte de los de las grandes, por eso una micro-ATX se atornilla en un chasis ATX.')+W('un chasis admite placas de su formato y de los <b>más pequeños</b>, nunca de uno mayor. Una mini-ITX cabe en una semitorre; una ATX no cabe en una minitorre.')],

["Refrigeración y flujo de aire",L(['El aire frío <b>entra por el frontal</b> (y a veces por abajo); el caliente <b>sale por detrás y por arriba</b>, porque el aire caliente sube.','Ventiladores habituales: <b>120 y 140 mm</b>. Los radiadores de refrigeración líquida se nombran por su largo: <b>240, 280 o 360 mm</b> (uno de 360 lleva tres ventiladores de 120).','Si entra más aire del que sale hay <b>presión positiva</b>. Con filtros en las entradas, entra menos polvo por las rendijas.'])],

]],
["La placa base",[
["Formatos",T(['Formato','Medidas','Chasis típico','Observaciones'],[['E-ATX','Mayor que ATX','Torre completa','Estaciones de trabajo'],['ATX','30,5 × 24,4 cm','Semitorre','El más común'],['micro-ATX','24,4 × 24,4 cm','Minitorre','Menos ranuras de expansión'],['mini-ITX','17 × 17 cm','Formato pequeño','Normalmente 2 ranuras de memoria y 1 de expansión']])],
["Elementos (1–7)",T(['Elemento','Cómo se reconoce','Para qué sirve'],[['<b>Zócalo de la CPU</b>','Cuadrado grande arriba, hacia el centro','Aloja el procesador. Cada zócalo admite una familia concreta (AM5 en AMD, LGA1700 en Intel)'],['<b>VRM</b>','Disipadores que rodean el zócalo por arriba y por la izquierda','Bajan la tensión de la fuente a la que usa el procesador'],['<b>Ranuras DIMM</b>','Largas y finas, en paralelo, a la derecha del zócalo','Memoria RAM. Por parejas para doble canal'],['<b>PCIe x16</b>','Ranura larga, la más cercana al procesador','Tarjeta gráfica'],['<b>PCIe x1</b>','Ranura muy corta','Tarjetas pequeñas: red, wifi, sonido'],['<b>Ranura M.2</b>','Pequeña, con un tornillo al otro extremo','SSD M.2 sin cables. Los más rápidos usan NVMe'],['<b>Chipset</b>','Disipador plano, abajo a la derecha','Conecta el procesador con discos, USB y ranuras secundarias']])],
["Elementos (8–13)",T(['Elemento','Cómo se reconoce','Para qué sirve'],[['<b>Conectores SATA</b>','Pequeños, apilados en el borde derecho','Cable de datos de discos SATA y unidades ópticas'],['<b>Conector de 24 pines</b>','Grande y alargado, borde derecho','Alimentación principal de la placa'],['<b>EPS de 8 pines</b>','Arriba a la izquierda, junto al panel trasero','Alimentación del procesador'],['<b>Cabecera del panel frontal</b>','Hilera de pines pequeños, borde de abajo','Encendido, reinicio y luces del chasis'],['<b>Panel trasero de E/S</b>','Bloque en el borde izquierdo','USB, red, audio y vídeo'],['<b>Pila</b>','Pila de botón redonda','Mantiene la BIOS y el reloj con el equipo desenchufado']])+'<p style="font-size:.86rem">Además hay cabeceras USB internas, donde se conectan los USB del frontal del chasis.</p>'+W('dos conectores llevan corriente de la fuente a la placa: el de <b>24 pines</b> (toda la placa) y el <b>EPS de 8 pines</b> (el procesador). Dos elementos suelen llevar disipador: el <b>VRM</b> (rodea el zócalo) y el <b>chipset</b> (solo, abajo).')]
]],
["Identificar la placa y su documentación",[
["Sin abrir el equipo",D('Un técnico identifica la placa <b>antes de abrir</b>: ahorra tiempo y no rompe los precintos de garantía.')+L(['<b>msinfo32</b> (Windows + R): «Fabricante de la placa base», «Producto de la placa base» y «Versión y fecha de BIOS».','<b>PowerShell</b>: el comando de abajo muestra fabricante y modelo.'])+'<pre class="ex">Get-CimInstance Win32_BaseBoard</pre>'+W('comprueba el modelo letra a letra: una B760M y una B760 son placas distintas.')],

["Equipos de marca",D('En HP, Dell, Lenovo… la placa suele tener un código interno que no lleva a ningún manual. La documentación se busca <b>por el ordenador</b>.')+L(['«Modelo del sistema» de msinfo32.','Etiqueta de servicio o número de serie de la pegatina del equipo.','En lugar del manual suele haber una <b>guía de servicio</b>.'])],

]],
["La BIOS y la UEFI",[
["Qué es el firmware",D('Es el programa grabado en un chip de la placa que se ejecuta <b>antes que el sistema operativo</b>: comprueba el hardware, lo prepara y le pasa el control. A la UEFI se la sigue llamando «la BIOS».')+T(['','BIOS','UEFI'],[['Edad','La original, años 80','Su sustituta, la actual'],['Aspecto','Texto, solo teclado','Gráfico, admite ratón'],['Discos','Arranca de discos de hasta 2 TB','Discos mucho mayores'],['Seguridad','Sin arranque seguro','Con Secure Boot']])],
["POST, CMOS y pila",L(['<b>POST</b> (autoprueba de encendido): lo primero que hace el firmware. Comprueba procesador, memoria y gráfica. Si falla, avisa con <b>pitidos o luces</b> porque aún no hay imagen; el manual explica cada código.','La configuración se guarda en la memoria <b>CMOS</b>, que mantiene la <b>pila</b>.','Pila agotada: el equipo <b>pierde fecha y hora</b> al desenchufarse.','Quitar la pila unos minutos con el equipo desenchufado devuelve la configuración a la de fábrica.'])],

["Qué se configura",T(['Opción','En inglés','Para qué sirve'],[['Fecha y hora','Date, Time','Reloj del sistema'],['Orden de arranque','Boot order / priority','Qué dispositivo arranca primero: disco, USB, red'],['Arranque seguro','Secure Boot','Solo deja arrancar sistemas firmados. Frena virus de arranque'],['TPM','TPM, Intel PTT, AMD fTPM','Chip que guarda claves de cifrado. PTT y fTPM son el TPM integrado en la CPU'],['Virtualización','VT-x, SVM','Necesaria para máquinas virtuales'],['Perfil de memoria','XMP, EXPO','Pone la RAM a la velocidad anunciada'],['Ventiladores','Fan control','Velocidad según temperatura'],['Contraseña','Administrator / Supervisor','Impide que otros cambien la configuración'],['Valores por defecto','Load (optimal) defaults','Deshace los cambios. Lo primero que se prueba si algo va mal'],['Guardar y salir','Save and exit (F10)','Sin guardar no se aplica nada'],['Encendido por red','Wake on LAN','Enciende el equipo desde la red']])+W('Windows 11 exige <b>UEFI, arranque seguro y TPM 2.0</b>. En msinfo32, «Modo de BIOS» y «Estado de arranque seguro» lo muestran.')],
["Actualizar el firmware",L(['Se actualiza para admitir <b>procesadores nuevos</b>, corregir fallos o cerrar agujeros de seguridad. Si el procesador necesita una BIOS más nueva que la instalada, el equipo puede no arrancar.','Operación <b>delicada</b>: si se va la luz a mitad, la placa puede quedar inservible. Algunas tienen BIOS de reserva o botón de recuperación.','Regla general: si el equipo funciona bien y no hace falta, <b>no se actualiza</b>.'])]
]],
["Vocabulario en inglés",[
["Términos que más vas a encontrar",T(['Inglés','Español','Inglés','Español'],[['Case','Chasis, caja','Socket','Zócalo'],['Clearance','Holgura','Slot','Ranura'],['Drive bay','Bahía','Header','Cabecera (pines)'],['Expansion slot','Ranura de expansión','Rear I/O','Panel trasero de E/S'],['Airflow','Flujo de aire','Package contents','Contenido de la caja'],['Fan / Radiator','Ventilador / Radiador','Support list','Lista de compatibilidad'],['Power supply (PSU)','Fuente de alimentación','Drivers','Controladores'],['Motherboard','Placa base','Boot','Arranque']])]
]]

const MC=[
['¿Cabe una placa ATX en un chasis minitorre?',['No, es mayor que micro-ATX','Sí, siempre','Solo con adaptador','Solo si es de aluminio'],0,'La minitorre admite micro-ATX y menores; un chasis nunca admite un formato mayor.'],

let h='';
S.forEach((s,i)=>{h+='<h2 class="st" id="s'+i+'"><span class="n">'+(i+1)+'</span>'+s[0]+'</h2>'+s[1].map((c,j)=>'<div class="cd"><button class="ch" aria-expanded="'+(j==0)+'" onclick="tog(this)"><span>'+c[0]+'</span><i>▶</i></button><div class="cb'+(j==0?' on':'')+'">'+c[1]+'</div></div>').join('')});
h+='<h2 class="st" id="test"><span class="n">★</span>Test de examen</h2><p class="mu" style="margin-bottom:.8rem">Cada pregunta te explica la respuesta. Las preguntas y el orden de las opciones cambian cada vez.</p><div id="modes">'+[['all','Mezcla'],['mc','Test'],['tf','V / F'],['fi','Rellenar']].map(m=>'<button class="gh" data-m="'+m[0]+'" onclick="modo(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div><div class="row" style="justify-content:space-between;align-items:center;margin:.5rem 0 1rem"><div><div class="bar"><div id="pb"></div></div><div class="mu" id="pl"></div></div><div><button class="gh" onclick="ini(false)">↺ Repetir</button><button class="btn" onclick="ini(true)">Preguntas nuevas</button></div></div><div id="qc"></div><div class="fx" id="fx"><span class="mu">Resultado final</span><b id="fn"></b><p id="fm" class="mu" style="margin:.5rem 0 1rem"></p><button class="btn" onclick="ini(true)">Preguntas nuevas</button></div>';

let QS=[],done=0,ok=0,mode='all';
const CNT={all:{mc:8,tf:5,fi:4},mc:{mc:12},tf:{tf:12},fi:{fi:6}},
nb=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\s]/g,'');
function build(){const c=CNT[mode],a=[];
if(c.mc)a.push(...sh(MC).slice(0,c.mc).map(x=>{const p=sh(x[1].map((t,i)=>[t,i==x[2]]));return{t:'mc',q:x[0],o:p.map(y=>y[0]),a:p.findIndex(y=>y[1]),e:x[3]}}));
if(c.tf)a.push(...sh(TF).slice(0,c.tf).map(x=>({t:'tf',q:x[0],a:x[1],e:x[2]})));
if(c.fi)a.push(...sh(FI).slice(0,c.fi).map(x=>({t:'fill',q:x[0],a:x[1],e:x[2]})));
return mode=='all'?sh(a):a}
function card(q,n){let b='';
if(q.t=='mc')b=q.o.map((o,i)=>'<button class="op" data-q="'+n+'" onclick="mcP('+n+','+i+',this)">'+o+'</button>').join('');
else if(q.t=='tf')b=['Verdadero','Falso'].map((o,i)=>'<button class="op" data-q="'+n+'" onclick="tfP('+n+','+(i==0)+',this)">'+o+'</button>').join('');
else b='<div class="row"><input class="in" id="in'+n+'" placeholder="Tu respuesta" autocomplete="off" aria-label="Tu respuesta" onkeydown="if(event.key===\'Enter\')chk('+n+')"><button class="btn" onclick="chk('+n+')">Comprobar</button></div>';
return '<div class="q"><div class="qn">Pregunta '+(n+1)+' de '+QS.length+'</div><div class="qt">'+q.q+'</div>'+b+'<div class="fb" id="fb'+n+'" role="status"></div></div>'}
function res(n,g,m){const q=QS[n];if(q.d)return;q.d=1;done++;if(g)ok++;const f=$('#fb'+n);f.className='fb '+(g?'ok':'ko');f.textContent=(g?'✅ Correcto. ':'❌ Incorrecto. ')+m;up();
if(done==QS.length){const t=(ok/QS.length*10).toFixed(1);$('#fn').textContent=t+' / 10';$('#fm').textContent=ok+' de '+QS.length+' correctas. '+(t>=9?'Listo para el examen.':t>=5?'Aprobado: repasa los fallos.':'Repasa los apuntes y vuelve a intentarlo.');$('#fx').style.display='block'}}
function mcP(n,i,b){const q=QS[n];if(q.d)return;document.querySelectorAll('[data-q="'+n+'"]').forEach((x,k)=>{x.disabled=true;if(k==q.a)x.classList.add('ok')});if(i!=q.a)b.classList.add('ko');res(n,i==q.a,q.e)}
function tfP(n,v,b){const q=QS[n];if(q.d)return;document.querySelectorAll('[data-q="'+n+'"]').forEach((x,k)=>{x.disabled=true;if((k==0)==q.a)x.classList.add('ok')});if(v!==q.a)b.classList.add('ko');res(n,v===q.a,q.e)}
function chk(n){const q=QS[n],i=$('#in'+n);if(q.d)return;i.disabled=true;const g=q.a.some(a=>nb(a)==nb(i.value));res(n,g,(g?'':'Respuesta: '+q.a[0]+'. ')+q.e)}
function up(){$('#pb').style.width=(QS.length?done/QS.length*100:0)+'%';$('#pl').textContent=done+' / '+QS.length+' respondidas · '+ok+' correctas'}
function ini(nw){if(nw||!QS.length)QS=build();QS.forEach(q=>q.d=0);done=0;ok=0;$('#fx').style.display='none';$('#qc').innerHTML=QS.map(card).join('');up()}
function modo(m){mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));ini(true)}
function tog(b){b.setAttribute('aria-expanded',b.nextElementSibling.classList.toggle('on'))}
modo('all');
